<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 · {{ site.title }}</title>
  <script src="/static/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/static/theme.css?v=1">
  <link rel="stylesheet" href="/static/admin.css?v=12">
</head>
<body class="login-page">
  <div class="login-theme">{% include "partials/theme-toggle.html" %}</div>
  <main class="login-card">
    <div class="login-logo">T</div>
    <p class="eyebrow">SIGN IN</p>
    <h1>{{ site.title }}</h1>
    <p class="muted">登录后台，管理文章、笔记和 review。</p>

    {% if let Some(error) = error %}
      <div class="flash flash-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>用户名
        <input type="text" name="username" value="{{ username }}" required autofocus autocomplete="username">
      </label>
      <label>密码
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="button button-block" type="submit">登录</button>
    </form>

    <p class="login-foot"><a href="/">← 返回首页</a></p>
  </main>
</body>
</html>
