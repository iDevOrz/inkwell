name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  importer:
    name: Test migration importer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/inkwell-import-venv"
          "$RUNNER_TEMP/inkwell-import-venv/bin/pip" install -r scripts/requirements.txt

      - name: Run importer safety tests
        run: |
          "$RUNNER_TEMP/inkwell-import-venv/bin/python" -m unittest discover -s scripts -p 'test_*.py'

  checks:
    name: Format, build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the version pinned in rust-toolchain.toml (with clippy, rustfmt).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: Check minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build with the MSRV
        run: cargo "+$MSRV" check --locked --all-targets

  docker-build:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Compose preserves deployment settings
        env:
          ADMIN_PASSWORD: ci-password
          MCP_TOKEN_SCOPES: read
          TRUST_PROXY_HEADERS: "true"
        run: |
          docker compose config --format json > "$RUNNER_TEMP/inkwell-compose.json"
          python3 -c 'import json, os; env = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "inkwell-compose.json")))["services"]["inkwell"]["environment"]; assert env["MCP_TOKEN_SCOPES"] == "read", env["MCP_TOKEN_SCOPES"]; assert env["TRUST_PROXY_HEADERS"] == "true", env["TRUST_PROXY_HEADERS"]'

      - name: Build image
        run: docker build --tag inkwell:ci .

      - name: Verify startup and data-volume persistence
        run: |
          volume="inkwell-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="inkwell-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:38080:3000 \
            --env ADMIN_PASSWORD=ci-password \
            --env SITE_URL=http://127.0.0.1:38080 \
            --mount "type=volume,src=$volume,dst=/app/data" \
            inkwell:ci

          wait_healthy() {
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:38080/healthz > /dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs "$container"
            return 1
          }

          wait_healthy
          # The in-image probe is what Docker's HEALTHCHECK runs.
          docker exec "$container" inkwell healthcheck
          docker exec "$container" test -s /app/data/inkwell.db

          docker restart "$container"
          wait_healthy
          docker exec "$container" inkwell healthcheck
          docker exec "$container" test -s /app/data/inkwell.db

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    env:
      # Fail the build if line coverage drops below this percentage.
      COVERAGE_MIN_LINES: 85
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain and LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Run tests with coverage
        run: cargo llvm-cov --locked --all-targets --no-report

      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Summarize coverage and enforce minimum
        run: |
          {
            echo "### Rust test coverage (minimum ${COVERAGE_MIN_LINES}% lines)"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_MIN_LINES" > /dev/null

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
