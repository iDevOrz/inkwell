<article class="post-card">
  <div class="post-card-meta">
    <time>{{ post.published_label }}</time>
    {% if let Some(category) = post.categories.first() %}
      <span class="dot">·</span>
      <a href="/categories/{{ category.slug }}">{{ category.name }}</a>
    {% endif %}
    <span class="dot">·</span>
    <span>{{ post.author_name }}</span>
  </div>
  <h2><a href="/archives/{{ post.content.slug }}">{{ post.content.title }}</a></h2>
  <p class="post-card-excerpt">{{ post.excerpt_text }}</p>
  {% if !post.tags.is_empty() %}
    <div class="tag-list">
      {% for tag in post.tags %}
        <a class="tag" href="/tags/{{ tag.slug }}">#{{ tag.name }}</a>
      {% endfor %}
    </div>
  {% endif %}
</article>
