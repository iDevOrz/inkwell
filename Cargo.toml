[package]
name = "inkwell"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust: sqlx 0.9 requires 1.94. Checked by the `msrv` CI job.
rust-version = "1.94"
description = "A small, self-hosted blog and notes system with MCP support"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
pulldown-cmark = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3.2.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
subtle = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-gzip", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
