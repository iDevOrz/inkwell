<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ ctx.site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ ctx.site.description }}{% endblock %}">
  <meta name="keywords" content="{{ ctx.site.keywords }}">
  <link rel="canonical" href="{% block canonical %}{{ ctx.site.site_url }}/{% endblock %}">
  <meta property="og:site_name" content="{{ ctx.site.title }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ ctx.site.title }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ ctx.site.description }}{% endblock %}">
  <meta property="og:url" content="{% block og_url %}{{ ctx.site.site_url }}/{% endblock %}">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/feed.xml">
  <link rel="alternate" type="application/atom+xml" title="Atom" href="/atom.xml">
  <script src="/static/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/static/theme.css?v=1">
  <link rel="stylesheet" href="/static/site.css?v=28">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container-wide header-inner">
      <a class="brand" href="/" aria-label="返回首页">
        <span class="logo" aria-hidden="true">T</span>
        <span class="brand-text">{{ ctx.site.title }}</span>
      </a>
      <div class="header-actions">
        <form class="search-form" method="get" action="/search" role="search">
          <input type="search" name="q" placeholder="搜索…" aria-label="搜索">
          <button type="submit" aria-label="搜索">→</button>
        </form>
        {% include "partials/theme-toggle.html" %}
      </div>
    </div>
  </header>

  <main class="container-wide main">
    {% include "partials/flash.html" %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container-wide footer-inner">
      <span>{{ ctx.site.footer_text }}</span>
      <span class="footer-links">
        <a href="/feed.xml">RSS</a>
        <a href="/atom.xml">Atom</a>
        <a href="/sitemap.xml">Sitemap</a>
      </span>
    </div>
  </footer>
</body>
</html>
