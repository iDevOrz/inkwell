{% extends "admin/base.html" %}

{% block title %}修改密码{% endblock %}
{% block heading %}修改密码{% endblock %}

{% block content %}
<form method="post" action="/admin/password" class="panel stack-form narrow-form">
  <input type="hidden" name="_csrf" value="{{ ctx.csrf }}">
  <label class="field">原密码
    <input type="password" name="old_password" required autocomplete="current-password">
  </label>
  <label class="field">新密码
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    <span class="field-hint">至少 8 个字符</span>
  </label>
  <label class="field">确认新密码
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
  </label>
  <button class="button" type="submit">更新密码</button>
</form>
{% endblock %}
